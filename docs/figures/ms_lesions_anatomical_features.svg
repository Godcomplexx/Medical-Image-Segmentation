<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1A1A1A; }
    .title { font-size: 34px; font-weight: 700; text-anchor: middle; }
    .label { font-size: 23px; font-weight: 700; }
    .small { font-size: 19px; }
    .call { fill: #FFFFFF; stroke: #4D4D4D; stroke-width: 2.5; rx: 10; }
    .line { fill: none; stroke: #4D4D4D; stroke-width: 2.5; marker-end: url(#arrow); }
    .measure { fill: none; stroke: #4D4D4D; stroke-width: 2.5; stroke-dasharray: 7 6; marker-start: url(#dot); marker-end: url(#arrowOrange); }
  </style>
  <defs>
