[tool.poetry]
name = "math_app"
version = "0.1.0"
description = "FastAPI + Ultralytics + DICOM + CV"
authors = ["Segmentation"]

[tool.poetry.dependencies]
python = "^3.10"

# Web server
fastapi = "0.116.0"
uvicorn = "*"
httpx = "0.28.1"
python-multipart = "*"
python-dotenv = "1.1.0"
pydantic = "2.11.3"
pydantic-settings = "2.8.1"

# Machine learning / computer vision
ultralytics = "8.3.111"
ultralytics-thop = "2.0.14"
opencv-python = "4.11.0.86"
numpy = "2.0.2"
pillow = "11.1.0"
tqdm = "4.67.1"
matplotlib = "3.9.4"
scikit-learn = "1.6.1"
pandas = "2.2.3"
imageio = '*'
torch = "*"
scikit-image = "*"

# DICOM
pydicom = "2.4.4"
dicom2nifti = "2.3.4"
nibabel = "5.3.2"
python-gdcm = "3.0.24.1"

# System monitoring
psutil = "7.0.0"

# Timezone
pytz = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"